<!DOCTYPE html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#26122F">
<title>Una carta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap" rel="stylesheet">

<style>
  /* ===== Paleta: noche ciruela + papel de carta + cera roja ===== */
  :root {
    --night-1: #5A2147; --night-2: #26122F; --night-3: #150A1F;
    --paper: #FFF7F5;  --ruled: #F1D5DC;  --margin: #E9A3B3;
    --ink: #3B1530;
    --wax: #B3203F;    --wax-d: #7E1229;
    --yes: #2C7A58;
    --no: #C23B55;
    --hand: "Caveat", "Snell Roundhand", "Bradley Hand", cursive;
    --ui: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  body {
    font-family: var(--ui); color: var(--ink);
    background: radial-gradient(90% 65% at 50% 28%, var(--night-1) 0%, var(--night-2) 58%, var(--night-3) 100%);
    background-color: var(--night-3);
  }
  .screen {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: calc(env(safe-area-inset-top, 0px) + 20px) 20px calc(env(safe-area-inset-bottom, 0px) + 20px);
  }
  /* Pestaña oculta: se pausan todas las animaciones CSS */
  .paused *, .paused *::before, .paused *::after { animation-play-state: paused !important; }

  /* ===== 1. El sobre ===== */
  .hint { font: 700 2.2rem/1.1 var(--hand); color: #FFE3EA; margin: 0 0 34px; text-align: center; }
  .tap { font: 500 1.3rem var(--hand); color: #FFE3EA; opacity: .6; margin: 14px 0 0; }
  #intro.opening .hint, #intro.opening .tap, #intro.opening .floor { animation: fadeout .5s forwards; }
  @keyframes fadeout { to { opacity: 0; } }
  .floor { width: min(66vw, 250px); height: 18px; margin-top: 26px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(0,0,0,.55), transparent); animation: shadow 4.5s ease-in-out infinite; }
  @keyframes shadow { 0%,100% { transform: scale(1); opacity: .55; } 50% { transform: scale(.8); opacity: .32; } }

  .env {
    --grain: repeating-linear-gradient(0deg, rgba(120,60,70,.035) 0 1px, transparent 1px 3px), repeating-linear-gradient(90deg, rgba(120,60,70,.03) 0 1px, transparent 1px 4px);
    --lattice: repeating-linear-gradient(45deg, rgba(255,255,255,.08) 0 2px, transparent 2px 11px), repeating-linear-gradient(-45deg, rgba(255,255,255,.08) 0 2px, transparent 2px 11px);
    position: relative; width: min(88vw, 350px); aspect-ratio: 1.45; perspective: 900px; will-change: transform;
    transition: transform .6s ease-in, opacity .5s ease-in;
  }
  .env.away { transform: translateY(40vh) scale(.9); opacity: 0; }
  .env > * { position: absolute; }
  .e-back { inset: 0; border-radius: 6px; background: var(--grain), linear-gradient(150deg, #F4E2DE, #E6CAC6);
    box-shadow: 0 34px 60px rgba(0,0,0,.5), 0 2px 0 rgba(255,255,255,.45) inset; z-index: 0; }
  .liner { inset: 0; z-index: 1; -webkit-clip-path: polygon(0 0, 100% 0, 50% 58%); clip-path: polygon(0 0, 100% 0, 50% 58%);
    background: var(--lattice), linear-gradient(180deg, #5E1633, #7F2347); }
  .peek { z-index: 2; left: 7%; right: 7%; top: 8%; height: 82%; border-radius: 3px; padding: 10px 14px 0 28px;
    background: linear-gradient(90deg, transparent 20px, #E9A3B3 20px, #E9A3B3 21.5px, transparent 21.5px), repeating-linear-gradient(transparent 0 25px, #F1D5DC 25px 26px), #FFF7F5;
    box-shadow: 0 -3px 10px rgba(0,0,0,.18); transition: transform .9s cubic-bezier(.3,1.25,.4,1), opacity .5s ease-in; }
  .peek b { display: block; font: 700 1.6rem/1.05 var(--hand); color: var(--ink); }
  .peek i { display: block; font: 500 1.2rem/1.1 var(--hand); font-style: normal; color: var(--ink); opacity: .7; }
  .env.lift .peek { transform: translateY(-40%); }
  .env.out .peek { transform: translateY(-130%) scale(1.12); opacity: 0; }
  .pocket { inset: 0; z-index: 3; border-radius: 6px; overflow: hidden; filter: drop-shadow(0 -1px 2px rgba(70,20,40,.3)); }
  .pocket i { position: absolute; inset: 0; display: block; }
  .pl { background: var(--grain), linear-gradient(100deg, #EBD3CF, #DBBDB9); -webkit-clip-path: polygon(0 0, 52% 55%, 0 100%); clip-path: polygon(0 0, 52% 55%, 0 100%); }
  .pr { background: var(--grain), linear-gradient(260deg, #EAD1CD, #D8BAB6); -webkit-clip-path: polygon(100% 0, 48% 55%, 100% 100%); clip-path: polygon(100% 0, 48% 55%, 100% 100%); }
  .pb { background: var(--grain), linear-gradient(0deg, #F6E6E2, #EAD3CF 75%, #E2C8C4); -webkit-clip-path: polygon(0 100%, 50% 46%, 100% 100%); clip-path: polygon(0 100%, 50% 46%, 100% 100%); }
  .flap { left: 0; top: 0; width: 100%; height: 58%; z-index: 6; transform-origin: top; transform-style: preserve-3d;
    transition: transform .65s cubic-bezier(.5,0,.25,1), z-index 0s .3s; }
  .env.open .flap { transform: rotateX(180deg); z-index: 1; }
  .flap i { position: absolute; inset: 0; display: block; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .fs { background: rgba(90,25,45,.22); transform: translateY(3px); -webkit-clip-path: polygon(0 0, 100% 0, 50% 100%); clip-path: polygon(0 0, 100% 0, 50% 100%); }
  .ff { background: var(--grain), linear-gradient(180deg, #F8EAE6, #E7CFCB); -webkit-clip-path: polygon(0 0, 100% 0, 50% 100%); clip-path: polygon(0 0, 100% 0, 50% 100%); }
  .fb { background: var(--lattice), linear-gradient(180deg, #7F2347, #5E1633); transform: rotateX(180deg);
    -webkit-clip-path: polygon(0 100%, 100% 100%, 50% 0); clip-path: polygon(0 100%, 100% 100%, 50% 0); }
  .from { z-index: 4; left: 5%; bottom: 5%; font: 700 1.15rem var(--hand); color: var(--ink); opacity: .6; transform: rotate(-3deg); }
  .stamp { z-index: 4; right: 4%; top: 26%; width: 44px; height: 54px; padding: 4px; background: #fff; border: 3px dotted #DDC0BC;
    transform: rotate(4deg); box-shadow: 0 2px 4px rgba(60,20,30,.25); display: flex; flex-direction: column; align-items: center; justify-content: center;
    background-image: linear-gradient(160deg, #FFE3EA, #FFB3C1); background-clip: padding-box; }
  .stamp svg { width: 24px; height: 24px; fill: #C42846; }
  .stamp span { font: 700 .72rem/1 var(--hand); color: #7E1229; margin-top: 2px; }
  .pm { z-index: 4; right: 7%; top: 40%; width: 84px; height: 44px; opacity: .5; transform: rotate(-8deg); fill: none; stroke: #5B1A2E; stroke-width: 1.2; }
  .pm text { fill: #5B1A2E; stroke: none; font: 700 7px var(--hand); }
  .to { z-index: 4; left: 0; right: 0; bottom: 9%; text-align: center; font: 700 2.2rem/1 var(--hand); color: var(--ink); }
  .to svg { display: block; width: 46%; height: 12px; margin: 1px auto 0; fill: none; stroke: var(--wax); stroke-width: 2; stroke-linecap: round; opacity: .6; }
  .seal {
    z-index: 7; left: 50%; top: 55%; width: 74px; height: 74px; margin: -37px 0 0 -37px; border: 0; padding: 0;
    border-radius: 52% 48% 55% 45% / 47% 56% 44% 53%;
    background: radial-gradient(circle at 32% 28%, #F0526F 0, #C42846 35%, #9E1B37 70%, #6E0F25 100%);
    box-shadow: 0 8px 16px rgba(50,0,15,.55), inset 0 2px 3px rgba(255,255,255,.35), inset 0 -4px 6px rgba(0,0,0,.35);
    color: #FFC9D4; font: 700 2.4rem/74px var(--hand); text-shadow: 0 -1px 0 rgba(0,0,0,.4), 0 1px 0 rgba(255,255,255,.25);
    cursor: pointer; touch-action: manipulation; animation: sealBeat 1.6s ease-in-out infinite; transition: transform .3s, opacity .3s;
  }
  @keyframes sealBeat { 0%,100% { scale: 1; } 50% { scale: 1.06; } }
  .seal::after { content: ""; position: absolute; inset: 9px; border-radius: inherit; border: 2px solid rgba(255,200,212,.4); box-shadow: inset 0 0 4px rgba(0,0,0,.3); }
  .drip { position: absolute; border-radius: 50%; background: #A81E3A; box-shadow: inset 0 -2px 3px rgba(0,0,0,.3); }
  .d1 { width: 20px; height: 16px; left: -9px; bottom: 7px; } .d2 { width: 14px; height: 12px; right: -7px; top: 12px; }
  .env.open .seal { transform: scale(1.5); opacity: 0; animation: none; }

  /* ===== 2. La carta (papel rayado con margen) ===== */
  .paper, .letter {
    position: relative; width: min(90vw, 360px); padding: 38px 24px 26px 40px; text-align: left;
    background:
      linear-gradient(90deg, transparent 31px, var(--margin) 31px, var(--margin) 32.5px, transparent 32.5px),
      repeating-linear-gradient(transparent 0 33px, var(--ruled) 33px 34px),
      var(--paper);
    border-radius: 3px; transform: rotate(-1.2deg);
    box-shadow: 0 24px 50px rgba(0,0,0,.5);
    animation: rise .7s cubic-bezier(.2,1.1,.3,1);
  }
  @keyframes rise { 0% { opacity: 0; transform: translateY(90px) rotate(-8deg) scale(.82); } 60% { opacity: 1; transform: translateY(-10px) rotate(-.4deg) scale(1.02); } 100% { opacity: 1; transform: translateY(0) rotate(-1.2deg) scale(1); } }
  .tape { position: absolute; top: -13px; left: 50%; width: 92px; height: 26px; margin-left: -46px; transform: rotate(3deg);
    background: rgba(255,214,224,.75); box-shadow: 0 1px 3px rgba(0,0,0,.15); animation: tapeDrop .55s cubic-bezier(.3,1.6,.5,1) .55s both; }
  @keyframes tapeDrop { from { opacity: 0; transform: translateY(-34px) rotate(24deg) scale(1.3); } to { opacity: 1; transform: rotate(3deg); } }
  h1 { font: 700 clamp(2.3rem, 11vw, 2.9rem)/1.02 var(--hand); margin: 0 0 8px; white-space: pre-line; }
  .sub { font: 500 1.35rem/1.15 var(--hand); margin: 0 0 22px; min-height: 2.3em; opacity: .85; }
  .pop { animation: pop .35s cubic-bezier(.2,1.5,.4,1); }
  @keyframes pop { from { transform: scale(.92) rotate(-1deg); opacity: .3; } to { transform: none; opacity: 1; } }

  /* ===== Botones (animaciones solo con transform / scale / opacity) ===== */
  .buttons { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .btn, .mini, .chip { position: relative; overflow: hidden; -webkit-user-select: none; user-select: none; }
  .btn { font: 700 1.15rem/1 var(--ui); min-width: 6.6rem; padding: 15px 24px; border: 0; border-radius: 18px; color: #fff;
    cursor: pointer; touch-action: manipulation; transition: transform .15s, opacity .25s; letter-spacing: .01em; text-shadow: 0 1px 0 rgba(0,0,0,.25);
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  .btn::before, .mini::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 52%; pointer-events: none; border-radius: inherit; background: linear-gradient(180deg, rgba(255,255,255,.34), rgba(255,255,255,.03)); }
  .yes { background: linear-gradient(180deg, #34B77A, #1F8A55); box-shadow: 0 6px 0 #166A41, 0 12px 22px rgba(10,60,35,.38), inset 0 1px 0 rgba(255,255,255,.5);
    transform: scale(var(--s, 1)); transform-origin: left center; will-change: transform; }
  .yes:not(.hot):not(.big) { animation: breathe 3s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { scale: 1; } 50% { scale: 1.035; } }
  .yes:active { transform: translateY(3px) scale(var(--s, 1)); box-shadow: 0 2px 0 #166A41, 0 6px 12px rgba(10,60,35,.35); }
  .yes::after { content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 45%; pointer-events: none;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.55), transparent);
    transform: translateX(-160%) skewX(-20deg); animation: shine 3.6s ease-in-out infinite; }
  @keyframes shine { 0% { transform: translateX(-160%) skewX(-20deg); } 60%, 100% { transform: translateX(380%) skewX(-20deg); } }
  /* Sí encendido: tras varios "No" brilla en verde y llama la atención */
  .yes.hot, .yes.big { background: linear-gradient(135deg, #3DDC97, #1F9D63);
    box-shadow: 0 6px 0 #166A41, 0 0 26px 8px rgba(61,220,151,.7), inset 0 1px 0 rgba(255,255,255,.5); animation: hotPulse 1.4s ease-in-out infinite; }
  .yes.hot::after, .yes.big::after { animation-duration: 2.2s; }
  @keyframes hotPulse { 0%,100% { scale: 1; } 50% { scale: 1.07; } }
  .yes.big { font-size: 1.3rem; padding: 18px 28px; transform-origin: center; animation: appear .5s cubic-bezier(.2,1.4,.4,1), hotPulse 1.4s ease-in-out .5s infinite; }
  @keyframes appear { from { transform: scale(.4); opacity: 0; } to { transform: none; opacity: 1; } }
  .bh { width: 1.05em; height: 1.05em; fill: #fff; animation: beat 1.6s ease-in-out infinite; }
  .yes.hot .bh, .yes.big .bh { animation-duration: .8s; }
  .yes.squash { animation: squash .32s ease-out forwards !important; }
  @keyframes squash { 0% { transform: scale(1); } 30% { transform: scale(.88,1.1); } 60% { transform: scale(1.14,.92); } 100% { transform: scale(1.35); opacity: 0; } }
  .no { position: fixed; z-index: 10; left: 0; top: 0; will-change: translate, transform;
    background: linear-gradient(180deg, #E0586E, #B8334A); box-shadow: 0 6px 0 #8A2238, 0 12px 22px rgba(60,10,25,.35), inset 0 1px 0 rgba(255,255,255,.4);
    visibility: hidden; animation: tremble 3.6s ease-in-out infinite;
    transition: translate .14s cubic-bezier(.2,.9,.3,1.25), opacity .25s, transform .25s; }
  .no.gone { opacity: 0; transform: scale(.5); pointer-events: none; animation: none; }
  @keyframes tremble { 0%,84%,100% { transform: translate(0,0) rotate(0); } 86% { transform: translate(-2px,0) rotate(-2deg); } 88% { transform: translate(2px,0) rotate(2deg); }
    90% { transform: translate(-2px,0) rotate(-2deg); } 92% { transform: translate(2px,0) rotate(2deg); } 94% { transform: translate(-1px,0); } }
  .no.wob { animation: wob .35s; }
  @keyframes wob { 0% { transform: scale(.7) rotate(-12deg); } 60% { transform: scale(1.12) rotate(6deg); } 100% { transform: none; } }
  .no.ghost { pointer-events: none; transition: none; animation: ghost .45s ease-out forwards; visibility: visible; }
  @keyframes ghost { from { opacity: .55; transform: scale(1); } to { opacity: 0; transform: scale(1.5) rotate(8deg); } }
  .slot { display: inline-block; }

  /* ===== 3. Final ===== */
  .win { overflow-y: auto; justify-content: flex-start; padding-top: calc(env(safe-area-inset-top, 0px) + 34px); animation: fade .6s;
    -webkit-overflow-scrolling: touch; scrollbar-width: thin; scrollbar-color: rgba(255,214,224,.35) transparent; }
  .win > * { flex-shrink: 0; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .note { margin: 0 0 24px; padding: 12px 18px; max-width: 320px; background: #FFF1B8; color: #4A3A00; transform: rotate(2deg);
    font: 700 1.5rem/1.1 var(--hand); text-align: center; box-shadow: 0 8px 18px rgba(0,0,0,.35);
    animation: drop .9s cubic-bezier(.2,1.6,.4,1) .2s both; }
  @keyframes drop { from { opacity: 0; transform: translateY(-120px) rotate(-10deg); } to { opacity: 1; transform: rotate(2deg); } }
  .letter h2 { font: 700 2.6rem/1 var(--hand); margin: 0 0 10px; }
  .letter p { font: 500 1.5rem/34px var(--hand); margin: 0 0 12px; }
  .letter .sign { font-weight: 700; text-align: right; margin: 6px 0 0; }
  .replay { margin-top: 22px; background: none; border: 0; color: #FFE3EA; opacity: .55; font: 600 .9rem var(--ui); text-decoration: underline; padding: 10px; cursor: pointer; }
  .more { font: 500 1.5rem var(--hand); color: #FFE3EA; opacity: .75; margin: 22px 0 0; text-align: center; }
  .card { margin-top: 30px; transform: rotate(1deg); animation: none; }
  .reason { font: 700 1.8rem/34px var(--hand); min-height: 102px; margin: 0 0 4px; }
  .rcount { font: 500 1.2rem/34px var(--hand); opacity: .6; }
  .mini { font: 700 1.1rem var(--ui); padding: 13px 20px; border: 0; border-radius: 14px; color: #fff; cursor: pointer;
    background: linear-gradient(180deg, #D43A58, #A5203F); touch-action: manipulation;
    box-shadow: 0 5px 0 #7E1229, 0 10px 18px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.35); }
  .mini:active { transform: translateY(3px); box-shadow: 0 2px 0 #7E1229; }
  .mini.pulse { animation: softPulse 1.6s ease-in-out infinite; }
  @keyframes softPulse { 0%,100% { scale: 1; } 50% { scale: 1.07; } }
  .q { font: 700 1.5rem/34px var(--hand); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 2px 0 8px; }
  .chip { font: 700 1.35rem/1 var(--hand); padding: 7px 12px; border: 2px solid #E2C4C0; border-radius: 14px;
    background: #FFF8F3; color: var(--ink); touch-action: manipulation; cursor: pointer; box-shadow: 0 3px 0 #D9B8B3; transition: transform .15s, background .15s; }
  .chip:active { transform: translateY(2px); box-shadow: 0 1px 0 #D9B8B3; }
  .chip.on { background: linear-gradient(180deg, #FFD6E0, #FFB9CB); border-color: var(--wax); color: var(--wax-d); box-shadow: 0 3px 0 #B3203F; transform: rotate(-1.5deg) translateY(-1px); }
  .chip.on::after { content: "\2665"; margin-left: 6px; color: var(--wax); font-size: .9em; }
  .wa { text-decoration: none; text-align: center; background: #128C4A; box-shadow: 0 6px 0 #0B5E31, 0 10px 18px rgba(0,0,0,.2); margin-top: 10px; }
  .wa.off { opacity: .45; }
  .wa:not(.off) { animation: softPulse 1.8s ease-in-out infinite; }
  .hint2:empty { display: none; }
  .hint2 { font: 500 1.2rem/1.2 var(--hand); opacity: .75; margin-top: 12px; }
  .ink { position: absolute; border-radius: 50%; background: rgba(255,255,255,.5); transform: scale(0); pointer-events: none; animation: ink .6s ease-out forwards; }
  @keyframes ink { to { transform: scale(4.5); opacity: 0; } }
  @media (hover: hover) { .yes:hover, .mini:hover { filter: brightness(1.08); } }

  /* ===== Cielo: estrellas agrupadas (4 animaciones en vez de 48), auroras y luciérnagas ===== */
  #sky { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .tw { position: absolute; inset: 0; animation: twinkle 3s ease-in-out infinite; }
  .star { position: absolute; border-radius: 50%; background: #fff; }
  @keyframes twinkle { 0%,100% { opacity: .18; } 50% { opacity: 1; } }
  .shoot { position: absolute; width: 130px; height: 2px; opacity: 0; background: linear-gradient(90deg, #fff, rgba(255,255,255,0)); animation: shoot 10s linear infinite; }
  @keyframes shoot { 0% { opacity: 0; transform: translate(0,0) rotate(-30deg); } 2% { opacity: 1; } 8% { opacity: 0; transform: translate(-280px,160px) rotate(-30deg); } 100% { opacity: 0; transform: translate(-280px,160px) rotate(-30deg); } }
  .aur { position: absolute; width: min(70vmax, 1000px); height: min(70vmax, 1000px); border-radius: 50%; opacity: .3; will-change: transform; animation: drift 22s ease-in-out infinite alternate; }
  .a1 { left: -25vmax; top: -20vmax; background: radial-gradient(circle, #C2185B, transparent 65%); }
  .a2 { right: -25vmax; bottom: -25vmax; background: radial-gradient(circle, #6A1B9A, transparent 65%); animation-duration: 28s; }
  @keyframes drift { to { transform: translate(12vmax, 10vmax) scale(1.15); } }
  .fly { position: absolute; width: 5px; height: 5px; border-radius: 50%; background: #FFE8A8; box-shadow: 0 0 10px 3px rgba(255,210,122,.7); animation: fly var(--t, 9s) ease-in-out infinite alternate; }
  @keyframes fly { 0% { transform: translate(0,0); opacity: .15; } 50% { opacity: 1; } 100% { transform: translate(var(--x), var(--y)); opacity: .3; } }

  /* ===== Entrada ===== */
  .hint, .tap { animation: fadeup 1.1s cubic-bezier(.2,.8,.3,1) both; } .tap { animation-delay: 1.3s; }
  @keyframes fadeup { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .env { animation: floaty 4.5s ease-in-out infinite; } .env.open { animation: none; }
  @keyframes floaty { 0%,100% { transform: translateY(0) rotate(-.6deg); } 50% { transform: translateY(-9px) rotate(.6deg); } }
  .seal::before { content: ""; position: absolute; inset: -4px; border-radius: inherit; border: 2px solid rgba(255,140,165,.75); animation: ring 1.6s ease-out infinite; }
  .env.open .seal::before { display: none; }
  @keyframes ring { from { transform: scale(1); opacity: .9; } to { transform: scale(2); opacity: 0; } }
  .w { display: inline-block; opacity: 0; animation: word .6s cubic-bezier(.2,.9,.3,1.3) forwards; animation-delay: calc(var(--i) * var(--st, 110ms)); }
  @keyframes word { from { opacity: 0; transform: translateY(16px) rotate(-3deg); } to { opacity: 1; transform: none; } }
  .paper.settled { animation: none; } .paper.settled.shake { animation: shake .45s; }
  @keyframes shake { 0%,100% { transform: rotate(-1.2deg); } 20% { transform: rotate(-4deg) translateX(-8px); } 40% { transform: rotate(1.5deg) translateX(8px); } 60% { transform: rotate(-3deg) translateX(-5px); } 80% { transform: rotate(0) translateX(3px); } }
  .win .letter:not(.card) { transform-origin: top; animation: unfold .9s cubic-bezier(.2,.9,.3,1) .6s both; }
  @keyframes unfold { from { opacity: 0; transform: perspective(800px) rotateX(-75deg) rotate(-1.2deg); } to { opacity: 1; transform: rotate(-1.2deg); } }
  .win .letter:not(.card) > h2, .win .letter:not(.card) > p { animation: line .8s cubic-bezier(.2,.8,.3,1) both; }
  .win .letter:not(.card) > h2 { animation-delay: 1.3s; } .win .letter:not(.card) > :nth-child(3) { animation-delay: 2.1s; }

    { k: 'Capítulo cuatro', t: 'Tu casa', p: 'Al tercer día nos vimos en tu casa. Nos quedamos compartiendo, hablando de todo y de nada. Contigo cualquier plan tranquilo se siente como el mejor del mundo.' },
    { k: 'Capítulo cinco', t: 'La noche en el parque', p: 'Al cuarto día volvimos al parquecito. Vimos cómo la noche iba llegando y, mientras tanto, conocí tus gustos por la música mucho más a fondo. Escucharte hablar de lo que te apasiona me enamoró un poquito más.' },
    { k: 'Capítulo seis', t: 'Película y play', p: 'El quinto día estuvimos en tu casa viendo una película juntos. Me encantó estar acobijado junto a ti. Te enseñé a jugar un poco de PlayStation, nos reímos un montón y no faltaron los besitos. Fue un día de esos que uno quiere repetir.' },
    { k: 'Capítulo siete', t: 'Hoy', p: 'Y mira dónde estamos. Entre libros, Spider-Man, buen rap y charlas largas, descubrí que mi lugar favorito es donde estés tú.' },
    { k: 'Fin del capítulo', t: 'Continuará...', p: 'Lo mejor de esta historia es que apenas estamos empezando. Escríbela conmigo, página a página.', sig: true }
  ];
  const wd = (txt, b) => txt.split(' ').map((w, i) => '<span class="wd" style="--i:' + (b + i) + '">' + w + ' </span>').join('');
  const pageHTML = (pg, n) => pg.ded
    ? '<div class="dl wd" style="--i:0">Para <span class="cz">Ari</span>,</div><div class="dl2 wd" style="--i:4">mi lectora favorita.</div><div class="dl3 wd" style="--i:9">Esta historia es de los dos.</div>'
    : '<div class="k">' + pg.k + '</div><h4>' + pg.t + '</h4><p>' + wd(pg.p, 0) + '</p>' +
      (pg.sig ? '<div class="sig wd" style="--i:' + (pg.p.split(' ').length + 4) + '">— Alex</div>' : '') + '<div class="num">' + n + '</div>';
  const bookEl = $('book'), N = LIBRO.length + 1, leaves = [];
  const coverHTML = '<div class="front cover"><div class="frame"></div><svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg><i class="rule"></i><h3 class="gold">Nuestra<br>historia</h3><i class="rule"></i><div class="who gold">Alex &amp; <span class="cz">Ari</span></div><i class="shine"></i></div><div class="back end"></div>';
  for (let i = N - 1; i >= 0; i--) {
    const lf = document.createElement('div'); lf.className = 'leaf'; lf.style.setProperty('--z', (N - i) * 0.6);
    lf.innerHTML = i === 0 ? coverHTML : '<div class="front pg' + (LIBRO[i - 1].ded ? ' ded' : '') + '">' + pageHTML(LIBRO[i - 1], i) + '</div><div class="back"></div>';
    bookEl.appendChild(lf); leaves[i] = lf;
  }
  const dotsEl = $('dots'); for (let i = 0; i < N; i++) dotsEl.appendChild(Object.assign(document.createElement('i'), { className: 'dot' }));
  let cur = 0, busy = false;

  // La inclinación del libro se escribe directo en su transform (sin variables CSS que obliguen a recalcular todas las palabras)
  const st3 = $('stage3d'), tl = $('tilt');
  let tpx = 0, tpy = 0, tQueued = false;
  function applyTilt() {
    tQueued = false;
    tl.style.transform = 'rotateX(' + ((cur > 0 ? 5 : 12) + tpx).toFixed(2) + 'deg) rotateY(' + ((cur > 0 ? -3 : -16) + tpy).toFixed(2) + 'deg)';
  }
  function queueTilt() { if (!tQueued) { tQueued = true; requestAnimationFrame(applyTilt); } }
  st3.addEventListener('pointermove', e => { const r = st3.getBoundingClientRect(); tpy = ((e.clientX - r.left) / r.width - .5) * 14; tpx = -((e.clientY - r.top) / r.height - .5) * 10; queueTilt(); }, { passive: true });
  st3.addEventListener('pointerleave', () => { tpx = 0; tpy = 0; queueTilt(); });

  function paintBook() {
    [...dotsEl.children].forEach((d, i) => d.classList.toggle('on', i === cur));
    queueTilt();
    $('bkPrev').disabled = cur === 0;
    const nx = $('bkNext'); nx.disabled = cur === N - 1; nx.classList.toggle('pulse', cur === 0); nx.textContent = cur === 0 ? 'Abrir' : cur === N - 1 ? 'Fin' : 'Siguiente';
    $('bkSub').textContent = cur === 0 ? 'toca el libro para abrirlo' : cur === N - 1 ? 'y esto apenas empieza' : 'toca para pasar la página';
  }
  function goBook(dir) {
    const nxt = cur + dir; if (busy || nxt < 0 || nxt >= N) return; busy = true;
    const lf = dir > 0 ? leaves[cur] : leaves[nxt], r = bookEl.getBoundingClientRect();
    if (dir > 0) { lf.classList.add('flip', 'go-f'); const pe = leaves[nxt].querySelector('.pg'); if (pe) pe.classList.add('show'); }
    else { lf.style.visibility = ''; lf.classList.remove('flip'); lf.classList.add('go-b'); }
    emit(r.left + r.width / 2, r.top + r.height / 2, cur === 0 && dir > 0 ? 40 : 8, 'spark');
    cur = nxt; paintBook();
    if (cur === N - 1) setTimeout(() => burstAt(bookEl, 30, 'heart'), 900);
    setTimeout(() => { lf.classList.remove('go-f', 'go-b'); if (dir > 0) lf.style.visibility = 'hidden'; busy = false; }, 1150);   // la hoja ya pasada sale del render
  }
  let sx = null;
  bookEl.addEventListener('pointerdown', e => { sx = e.clientX; });
  bookEl.addEventListener('pointercancel', () => { sx = null; });
  bookEl.addEventListener('pointerup', e => {
    if (sx === null) return; const dx = e.clientX - sx; sx = null;
    if (Math.abs(dx) > 40) goBook(dx < 0 ? 1 : -1);
    else { const r = bookEl.getBoundingClientRect(); goBook(cur > 0 && e.clientX < r.left + r.width * .25 ? -1 : 1); }
  });
  $('bkNext').addEventListener('click', () => goBook(1)); $('bkPrev').addEventListener('click', () => goBook(-1));
  paintBook();

  /* ===== Efectos de botones y transiciones ===== */
  function flash() { const f = document.createElement('div'); f.className = 'flash'; document.body.appendChild(f); setTimeout(() => f.remove(), 850); }
  function bigHeart() {
    const NS = 'http://www.w3.org/2000/svg', h = document.createElementNS(NS, 'svg'); h.setAttribute('viewBox', '0 0 24 24'); h.setAttribute('class', 'zoomheart');
    const pa = document.createElementNS(NS, 'path'); pa.setAttribute('d', 'M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z'); h.appendChild(pa); document.body.appendChild(h);
    const els = [h]; for (let i = 0; i < (lite ? 1 : 3); i++) { const r = document.createElement('div'); r.className = 'shock'; r.style.animationDelay = (i * .22) + 's'; document.body.appendChild(r); els.push(r); }
    setTimeout(() => els.forEach(e => e.remove()), 2200);
  }
  function cascade(el, t, st) {
    el.textContent = ''; el.style.setProperty('--st', st + 'ms');
    t.split(' ').forEach((w, i) => { const sp = document.createElement('span'); sp.className = /Ari/.test(w) ? 'w cz' : 'w'; sp.style.setProperty('--i', i); sp.textContent = w; el.appendChild(sp); el.appendChild(document.createTextNode(' ')); });
  }
  document.addEventListener('pointerdown', e => {
    const b = e.target.closest && e.target.closest('.btn, .mini, .chip'); if (!b) return;
    const r = b.getBoundingClientRect(), s = document.createElement('span'); s.className = 'ink';
    s.style.cssText = 'left:' + (e.clientX - r.left - 30) + 'px;top:' + (e.clientY - r.top - 30) + 'px;width:60px;height:60px';
    b.appendChild(s); setTimeout(() => s.remove(), 650);
  }, true);
  let yesTapped = false;
  const onYes = e => {
    if (yesTapped) return; yesTapped = true; noGone = true;
    e.currentTarget.classList.add('squash'); burstAt(e.currentTarget, 34, 'fire');
    setTimeout(celebrar, 330);
  };
  yes1.addEventListener('click', onYes); yes2.addEventListener('click', onYes);

  /* ===== Lluvia de pétalos (canvas, pasos independientes de los Hz y sprites de emoji) ===== */
  function launchConfetti() {
    cfc.style.visibility = 'visible';
    const cols = ['#E8476A', '#FF8FA3', '#C2185B', '#FFB3C1', '#F06292'], emo = ['❤️', '💖', '💕'].map(emojiSpr);
    let parts = [];
    const make = burst => ({
      x: burst ? VW / 2 : R(0, VW), y: burst ? VH * 0.45 : -20,
      vx: burst ? R(-7, 7) : R(-1, 1), vy: burst ? R(-13, -3) : R(1.2, 3), g: burst ? 0.2 : 0.015,
      s: R(7, 12), rot: R(0, 6.28), vr: R(-.08, .08), flip: R(0, 6.28), col: cols[(Math.random() * cols.length) | 0],
      heart: Math.random() < 0.2 ? emo[(Math.random() * 3) | 0] : null
    });
    for (let i = 0; i < (reduceMotion ? 40 : Math.round(120 * Q)); i++) parts.push(make(true));
    const t0 = performance.now(), T = reduceMotion ? 2500 : 8000; let last = 0;
    (function frame(t) {
      const k = last ? Math.min((t - last) / 16.667, 3) : 1; last = t;
      cfx.clearRect(0, 0, VW, VH);
      if (t - t0 < T && parts.length < 260 * Q && Math.random() < 0.5 * k) parts.push(make(false), make(false));
      const damp = Math.pow(.995, k); let w = 0;
      for (let i = 0; i < parts.length; i++) {
        const p = parts[i];
        p.vy += p.g * k; p.vx *= damp; p.x += (p.vx + Math.sin(p.flip) * 0.6) * k; p.y += p.vy * k; p.rot += p.vr * k; p.flip += 0.07 * k;
        if (p.y >= VH + 40) continue;
        parts[w++] = p;
        const c = Math.cos(p.rot) * DPR, s = Math.sin(p.rot) * DPR;
        if (p.heart) { const d = p.s * 2.5; cfx.setTransform(c, s, -s, c, p.x * DPR, p.y * DPR); cfx.drawImage(p.heart, -d / 2, -d / 2, d, d); }
        else {
          const sy = Math.max(.25, Math.abs(Math.sin(p.flip)));
          cfx.setTransform(c, s, -s * sy, c * sy, p.x * DPR, p.y * DPR);
          cfx.fillStyle = p.col; cfx.beginPath(); cfx.ellipse(0, 0, p.s, p.s * 0.55, 0, 0, 6.283); cfx.fill();
        }
      }
      parts.length = w; cfx.setTransform(DPR, 0, 0, DPR, 0, 0);
      if (w || t - t0 < T) requestAnimationFrame(frame); else { cfx.clearRect(0, 0, VW, VH); cfc.style.visibility = 'hidden'; }
    })(performance.now());
  }

  /* ===== Arranque y rotación de pantalla ===== */
  writeTitle(TITULO0); setText(sub, SUBS[0]);
  setTimeout(() => watchFps(90, ms => { if (ms > 24) setLite(true); }), 800);   // si el equipo va justo, activa el modo ligero
  let rz = 0;
  addEventListener('resize', () => {
    if (rz) return;
    rz = requestAnimationFrame(() => {
      rz = 0; sizeCanvases();
      if (!noReady || noGone || won) return;
      if (noCount === 0) { placeNoAtSlot(); return; }
      setNoPos(clamp(noX, 12, innerWidth - noW - 12), clamp(noY, 12, innerHeight - noH - 12), true);
    });
  });
})();
</script>
</body>
